[package]
name = "tunnel-core"
description = "Client core of the B2B tunnel: QUIC connection, reconnect, IP packet encapsulation; builds as cdylib/staticlib for embedding (iOS/Android/Desktop)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "tunnel_core"
# lib       — unit and integration tests inside the workspace
# cdylib    — dynamic library: Android (JNI/uniffi), Desktop
# staticlib — static linking: iOS requires static libraries
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
tunnel-proto = { workspace = true }
tokio = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# FFI bindings: cli — the binding generator for Kotlin/Swift/Python,
# scaffolding is wired by the setup_scaffolding macro in lib.rs.
uniffi = { workspace = true, features = ["cli"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

# Binding generator: `cargo run -p tunnel-core --bin uniffi-bindgen --
# generate-all --library <libtunnel_core.so> --out-dir <dir>` generates
# kotlin+swift+python with one command (see build_sdk.sh).

[dev-dependencies]
# Integration tests run a local QUIC echo server.
tunnel-proto = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
# Engine logs are visible in tests (with_test_writer).
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "std"] }
